[package]
name = "clean-studio"
version = "1.0.0"
description = "Clean Studio — Automatización E2E Móvil y Web en Español (Rust + Tauri v2 + Maestro Core)"
authors = ["Clean Studio Team"]
edition = "2021"

[lib]
name = "clean_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
chrono = "0.4"
